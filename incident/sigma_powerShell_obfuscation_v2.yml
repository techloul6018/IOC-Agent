title: Detection of PowerShell Obfuscation and AMSI Bypass
id: 7f8e1c2a-3b4d-5e6f-7g84-9i0j1k2l3m4n-2024-11-15-0001
status: test
description: Detects PowerShell scripts exhibiting obfuscation techniques and AMSI bypass patterns.
logsource:
  product: windows
  service: powershell
  category: command_line
detection:
  selection:
    CommandLine|contains|'$encodedCommand'
  selection2:
    CommandLine|contains|'AMSI'
    CommandLine|contains|'bypass'
  selection3:
    CommandLine|contains|'[Ref].Assembly'
    CommandLine|contains|'amsiInitFile'
  condition: selection or selection2 or selection3
falsepositives:
  - Legitimate administration tasks using PowerShell
level: high
tags:
  - mitre.technique T1059.001
  - mitre.technique T1059
  - obfuscation
  - amsi_bypass